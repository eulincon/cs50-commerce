{% extends "auctions/layout.html" %} {% block body %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Create Listing</h2>
                </div>
                <div class="card-body">
                    {% if message %}
                    <div class="alert alert-warning">{{ message }}</div>
                    {% endif %}

                    <form action="{% url 'create_listing' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input class="form-control" autofocus type="text" name="title" placeholder="Enter listing title" required />
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea class="form-control" name="description" placeholder="Enter listing description" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="starting_bid">Starting Bid</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">$</span>
                                </div>
                                <input class="form-control" type="number" name="starting_bid" placeholder="0.00" min="0" step="0.01" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select class="form-control" name="category" required>
                                <option value="" disabled selected>Select a category</option>
                                {% for category_code, category_name in categories %}
                                    <option value="{{ category_code }}">{{ category_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="url">Image URL</label>
                            <input class="form-control" type="url" name="url" placeholder="https://example.com/image.jpg" />
                        </div>
                        <div class="form-group text-right">
                            <button type="submit" class="btn btn-primary">Create Listing</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
