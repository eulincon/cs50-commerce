<div class="card auction-item mb-4 shadow-sm hover-shadow">
    <a href="{% url 'listings' auction.id %}" class="text-decoration-none text-dark">
        {% if auction.url %}
        <div class="card-image-wrapper position-relative" style="height: 200px; overflow: hidden;">
            <img class="card-img-top listing-img h-100 w-100 object-fit-cover" 
                 src="{{ auction.url }}" 
                 alt="{{ auction.title}} photo">
        </div>
        {% endif %}
        <div class="card-body">
            <h5 class="card-title text-truncate mb-3">{{ auction.title }}</h5>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted">Current Price:</span>
                <span class="h5 text-primary mb-0 ml-2">${{ auction.currentPrice }}</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted">Category:</span>
                <span class="badge badge-info">{{ auction.get_category_display }}</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    <i class="far fa-clock mr-1"></i>
                    {{ auction.createdAt|date:"M d, Y" }}
                </small>
                {% if auction.closed %}
                    <span class="badge badge-danger">Closed</span>
                {% else %}
                    <span class="badge badge-success">Active</span>
                {% endif %}
            </div>
        </div>
    </a>
</div>
